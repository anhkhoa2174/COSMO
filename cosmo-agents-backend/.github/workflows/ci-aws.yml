name: CI-AWS

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GO_VERSION_FILE: go.mod
  GOVULNCHECK_VERSION: v1.1.4
  GOSEC_VERSION: v2.21.0

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - &fix_permission_step
        name: Fix permissions before checkout
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          echo "$SUDO_PASSWORD" | sudo -S chown -R $USER:$USER $GITHUB_WORKSPACE || true
          echo "$SUDO_PASSWORD" | sudo -S chmod -R u+rwX $GITHUB_WORKSPACE || true
      - &checkout_step
        name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - &setup_go_step
        name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false

      - &prepare_go_env_step
        name: Prepare Go environment
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Check formatting
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Go files must be formatted with gofmt. Please run:"
            echo "  gofmt -w ."
            echo "$fmt_out"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Start PostgreSQL for tests
        # The repository and service tests run against PostgreSQL, each in its own
        # throwaway schema (internal/testutil/pgtest), not against an in-memory
        # substitute. The container is named per run and bound to a random host
        # port so parallel workflows on this self-hosted runner cannot collide.
        run: |
          name="cosmo-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=cosmo_agents_test \
            -p 127.0.0.1::5432 pgvector/pgvector:pg16
          for i in $(seq 1 60); do
            docker exec "$name" pg_isready -U postgres -d cosmo_agents_test >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$name" psql -U postgres -d cosmo_agents_test \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          port="$(docker port "$name" 5432/tcp | head -1 | awk -F: '{print $NF}')"
          echo "PG_TEST_CONTAINER=$name" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:${port}/cosmo_agents_test?sslmode=disable" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: go test -timeout=10m ./...

      - name: Generate coverage for packages with tests
        run: |
          packages="$(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./... | tr '\n' ' ')"
          if [ -z "$packages" ]; then
            echo "No packages with tests; creating empty coverage file"
            : > coverage.out
            exit 0
          fi
          go test -v -coverprofile=coverage.out -covermode=atomic -timeout=10m $packages

      - name: Run race detector tests
        run: go test -v -race -timeout=12m ./...

      - name: Stop PostgreSQL for tests
        if: always()
        run: docker rm -f "${PG_TEST_CONTAINER:-cosmo-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}}" >/dev/null 2>&1 || true

  security:
    runs-on: self-hosted
    needs: verify
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *fix_permission_step
      - *fix_permission_step
      - *checkout_step
      - *setup_go_step
      - *prepare_go_env_step

      - name: Install govulncheck
        run: |
          if ! command -v govulncheck >/dev/null; then
            go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          fi

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Install gosec
        run: |
          if ! command -v gosec >/dev/null; then
            go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          fi

      - name: Run gosec
        run: |
          gosec -no-fail -fmt sarif -out gosec-results.sarif ./... || true
          gosec -no-fail -fmt text ./... || true
          test -f gosec-results.sarif || touch gosec-results.sarif
        continue-on-error: true

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/golang
        continue-on-error: true

  build:
    runs-on: self-hosted
    needs:
      - verify
      - security
    timeout-minutes: 10
    steps:
      - *fix_permission_step
      - *fix_permission_step
      - *checkout_step
      - *setup_go_step
      - *prepare_go_env_step

      - name: Build binaries
        run: make build

  deploy_production:
    name: deploy
    runs-on: self-hosted
    needs: [build]
    environment: prod

    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      GIT_SSH_CLONE_URL: ${{ secrets.GIT_SSH_CLONE_URL }}
      BOT_PRIVATE_TOKEN: ${{ secrets.BOT_PRIVATE_TOKEN }}
      SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}

    steps:
      - *fix_permission_step
      - *checkout_step

      - name: Install dependencies
        run: |
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' dpkg --configure -a || true
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' apt-get update -y
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' apt-get install -y curl openssh-client

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write SSH config
          {
            echo "Host *"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile=/dev/null"
            } > ~/.ssh/config
            
          chmod 600 ~/.ssh/config

      - name: Prepare Environment File
        run: |
          cat > .env <<EOF
          # Application Configuration
          APP_NAME=${{ secrets.APP_NAME }}
          ENV=${{ secrets.ENV }}
          APP_HOST=${{ secrets.APP_HOST }}
          APP_PORT=${{ secrets.APP_PORT }}
          DEBUG=${{ secrets.DEBUG }}

          BASE_URL=${{ secrets.BASE_URL }}

          # Database Configuration
          SQLALCHEMY_POSTGRES_URI=${{ secrets.SQLALCHEMY_POSTGRES_URI }}
          DB_MAX_OPEN_CONN=${{ secrets.DB_MAX_OPEN_CONN }}
          DB_MAX_IDLE_CONN=${{ secrets.DB_MAX_IDLE_CONN }}

          # Redis Configuration
          REDIS_URL=${{ secrets.REDIS_URL }}
          REDIS_PASSWORD=

          # Logging
          LOG_LEVEL=${{ secrets.LOG_LEVEL }}
          LOGGING_CONFIG_PATH=${{ secrets.LOGGING_CONFIG_PATH }}

          # Authentication & Security
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_HOURS=${{ secrets.JWT_EXPIRATION_HOURS }}
          ENABLE_AUTH=${{ secrets.ENABLE_AUTH }}
          RATE_LIMIT_ENABLED=${{ secrets.RATE_LIMIT_ENABLED }}
          RATE_LIMIT_MAX=${{ secrets.RATE_LIMIT_MAX }}
          RATE_LIMIT_WINDOW_MINUTES=${{ secrets.RATE_LIMIT_WINDOW_MINUTES }}
          PERSONAL_API_KEY_SECRET=${{ secrets.PERSONAL_API_KEY_SECRET }}

          # Token
          PERSONAL_API_KEY_SECRET=${{ secrets.PERSONAL_API_KEY_SECRET }}

          # OAuth2 - Google
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
          GOOGLE_PROJECT_ID=${{ secrets.GOOGLE_PROJECT_ID }}
          GOOGLE_PUBSUB_GMAIL_TOPIC=${{ secrets.GOOGLE_PUBSUB_GMAIL_TOPIC }}

          # Hubspot
          HUBSPOT_CLIENT_ID=${{ secrets.HUBSPOT_CLIENT_ID }}
          HUBSPOT_CLIENT_SECRET=${{ secrets.HUBSPOT_CLIENT_SECRET }}
          HUBSPOT_REDIRECT_URI=${{ secrets.HUBSPOT_REDIRECT_URI }}

          # Email
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_SYSTEM_EMAIL=${{ secrets.RESEND_SYSTEM_EMAIL }}

          # AI/OpenAI
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}

          # Sentry
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}

          # Coze
          COZE_APP_ID=${{ secrets.COZE_APP_ID }}
          COZE_PUBLIC_KEY_ID=${{ secrets.COZE_PUBLIC_KEY_ID }}
          COZE_PRIVATE_KEY_PATH=${{ secrets.COZE_PRIVATE_KEY_PATH }}

          # AWS S3
          COSMO_BUCKET=${{ secrets.COSMO_BUCKET }}
          COSMO_BUCKET_REGION=${{ secrets.COSMO_BUCKET_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT_URL=${{ secrets.AWS_S3_ENDPOINT_URL }}
          EOF
          chmod 600 .env

      - name: Prepare coze_oauth_private_key.pem
        run: |
          curl --header "PRIVATE-TOKEN: ${BOT_PRIVATE_TOKEN}" "https://gitlab.rockitflow.com/api/v4/projects/1/repository/files/backend%2Faiverse%2Fcosmo-agents%2Fcoze_oauth_private_key.pem/raw?ref=master" > coze_oauth_private_key.pem

      - name: Prepare project folder
        run: |
          # Add private key
          eval "$(ssh-agent -s)"
          echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -

          ssh ${DEPLOY_USER}@${DEPLOY_HOST} "
            set -eux

            if [ ! -d '${DEPLOY_PATH}' ]; then
              mkdir -p '${DEPLOY_PATH}'
              echo 'Created ${DEPLOY_PATH}'
            else
              echo '${DEPLOY_PATH} already exists'
            fi

            if [ ! -d '${DEPLOY_PATH}/.git' ]; then
              git clone ${GIT_SSH_CLONE_URL}
              echo 'Cloned repo into ${DEPLOY_PATH}'
            else
              echo 'Repo already exists, skipping clone'
            fi
          "

      - name: Deploy to production
        run: |
          # Add private key
          eval "$(ssh-agent -s)"
          echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -

          # Copy environment file
          scp .env ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env
          scp coze_oauth_private_key.pem ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/coze_oauth_private_key.pem

          # Deploy application
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} "
          set -e
            cd ${DEPLOY_PATH} &&
            git pull &&
            cd docker &&
            docker compose -f docker-compose.monitoring.yml down &&
            docker compose down &&
            docker compose up -d --build &&
            docker compose -f docker-compose.monitoring.yml up -d --build
            "
