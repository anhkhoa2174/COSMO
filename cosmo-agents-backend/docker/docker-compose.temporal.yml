name: ${COMPOSE_PROJECT_NAME:-cosmo-temporal}

services:
  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: cosmo-temporal
    ports:
      - "7233:7233"  # gRPC port for SDK connections
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=temporal-db
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal-config:/etc/temporal/config/dynamicconfig
    depends_on:
      temporal-db:
        condition: service_healthy
    networks:
      - temporal-network
    restart: unless-stopped

  # Temporal PostgreSQL Database
  temporal-db:
    image: postgres:15-alpine
    container_name: cosmo-temporal-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-network
    restart: unless-stopped

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: cosmo-temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    networks:
      - temporal-network
    restart: unless-stopped

volumes:
  temporal_db_data:

networks:
  temporal-network:
    driver: bridge
