name: ${COMPOSE_PROJECT_NAME:-cosmo-backend-dev}

services:
  cosmo_agents_app:
    container_name: cosmo-backend
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    image: 471112636744.dkr.ecr.ap-southeast-1.amazonaws.com/cosmo-agents:prod
    command: ["./server"]
    ports:
      - "8086:8080"
    env_file:
      - ../.env
    volumes:
      - ../coze_oauth_private_key.pem:/app/coze_oauth_private_key.pem:ro
    restart: unless-stopped
    depends_on:
      # Postgres is not part of this file: the deployment points at a managed
      # instance through SQLALCHEMY_POSTGRES_URI. Listing it here named a
      # service that does not exist, which Compose rejects as an invalid
      # project — the whole file failed to load, not just this line.
      - redis
    networks:
      - nginx
    # Add logging label in order to be read by promtail
    labels:
      - "logging=promtail"

  cosmo_agents_worker:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: cosmo-backend-worker
    image: 471112636744.dkr.ecr.ap-southeast-1.amazonaws.com/cosmo-agents:prod
    command: ["./worker"]
    env_file:
      - ../.env
    volumes:
      - ../coze_oauth_private_key.pem:/app/coze_oauth_private_key.pem:ro
    depends_on:
      # Postgres is not part of this file: the deployment points at a managed
      # instance through SQLALCHEMY_POSTGRES_URI. Listing it here named a
      # service that does not exist, which Compose rejects as an invalid
      # project — the whole file failed to load, not just this line.
      - redis
    restart: unless-stopped
    networks:
      - nginx
    # Add logging label in order to be read by promtail
    labels:
      - "logging=promtail"

  # postgres:
  #   image: pgvector/pgvector:pg16
  #   container_name: cosmo-backend-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: cosmo_agents
  #   ports:
  #     - "5438:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - nginx

  redis:
    image: redis:7-alpine
    container_name: cosmo-backend-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nginx

  # migrate:
  #   image: pgvector/pgvector:pg16
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   entrypoint: ["/bin/sh", "/migrate/migrate.sh"]
  #   environment:
  #     PGHOST: postgres
  #     PGPORT: "5432"
  #     PGUSER: postgres
  #     PGPASSWORD: postgres
  #     PGDATABASE: cosmo_agents
  #     MIGRATIONS_DIR: /migrations
  #   volumes:
  #     - ../migrations:/migrations:ro
  #     - ./migrate.sh:/migrate/migrate.sh:ro
  #   networks:
  #     - nginx

volumes:
  # postgres_data:
  redis_data:

networks:
  # Was `external: true`, which requires the network to have been created by
  # hand before anything here will start. Letting Compose create it removes a
  # setup step that is invisible until it fails; an existing network of the
  # same name is reused rather than duplicated.
  nginx:
    name: nginx
