global:
  scrape_interval: 45s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      # target to prometheus (container running on port 9090)
      - targets: ['localhost:9090']
  - job_name: 'node_exporter'
    static_configs:
      #target to node_exporter (container running on port 9100)
      - targets: ['node_exporter:9100']
  - job_name: 'cosmo-backend'
    static_configs:
      # target to cosmo backend (running on port 8081)
      - targets: ['host.docker.internal:8081']
