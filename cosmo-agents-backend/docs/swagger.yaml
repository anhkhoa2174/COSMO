info:
  contact:
    email: support@cosmo-agents.com
    name: API Support
    url: https://github.com/rockship/cosmo-agents-go
  description: API for managing AI agents, campaigns, tasks, and email automation
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Cosmo Agents API
  version: "1.0"
paths:
  /gmail/refresh-token:
    post:
      consumes:
      - application/json
      description: Manually refresh Gmail access token for current user
      produces:
      - application/json
      responses:
        "200":
          description: Refresh successful
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Refresh Gmail token manually
      tags:
      - Gmail
  /v1/agents:
    post:
      consumes:
      - application/json
      description: Creates a new AI agent with the provided configuration
      parameters:
      - description: Agent creation data
        in: body
        name: agent
