# =============================================================================
# Daily BD Actions API Contract
# =============================================================================
# Feature: 001-daily-bd-actions
# Version: 1.0.0
# Date: 2026-02-26
#
# DESIGN DECISIONS:
#
# 1. HYBRID APPROACH (one summary endpoint + focused sub-endpoints)
#    - GET  /v1/daily-actions          -> aggregated briefing (the "big" read)
#    - POST /v1/daily-actions/generate  -> trigger AI briefing generation
#    - PATCH /v1/daily-actions/{id}     -> update individual action state
#    - GET  /v1/daily-actions/events    -> SSE stream for real-time updates
#
#    Why not one giant endpoint?
#    - The briefing content (agent reasoning, draft messages, meeting preps)
#      is expensive to compute. We separate the generation trigger (POST) from
#      the read (GET) so the frontend can poll the GET cheaply while the POST
#      kicks off background AI work.
#    - Action state updates (mark sent, skip, snooze) need to be fast atomic
#      writes, not round-trips through the briefing generator.
#
#    Why not fully granular per-category endpoints?
#    - The frontend renders a single chat message with all categories. Fetching
#      5 separate endpoints creates waterfall latency. One GET returns
#      everything the initial render needs.
#    - Categories share the same prioritization context (the agent needs to
#      reason across all of them simultaneously).
#
# 2. SSE FOR REAL-TIME (not WebSocket)
#    - The spec requires "living document" behavior (FR-018, FR-019).
#    - SSE is simpler than WebSocket for server-to-client push, works through
#      CDNs/proxies, and the client only needs to listen (not send).
#    - Fallback: if SSE is unavailable, the frontend polls GET /v1/daily-actions
#      every 30 seconds.
#
# 3. RESPONSE STRUCTURE: categories as an ordered array (not object keys)
#    - The backend controls display order (priority). An array preserves
#      insertion order and allows the backend to reorder categories by urgency
#      without frontend changes.
#
# 4. EXISTING API REUSE
#    - This endpoint aggregates from v1/outreach/suggest, contacts/state,
#      contacts/draft, and meetings. It does NOT replace those endpoints.
#    - The daily-actions backend orchestrates calls to those services and adds
#      the agent reasoning layer on top.
# =============================================================================

openapi: "3.1.0"
info:
  title: Daily BD Actions API
  version: "1.0.0"
  description: |
    Aggregated daily action suggestions for BD reps. The BD Agent analyzes
    the entire pipeline and produces a prioritized, categorized action list
    with pre-generated drafts, meeting briefings, and strategic reasoning.

servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: "https://api.cosmoagents.com"

# =============================================================================
# PATH DEFINITIONS
# =============================================================================
paths:

  # ---------------------------------------------------------------------------
  # POST /v1/daily-actions/generate
  # ---------------------------------------------------------------------------
  # Triggers the AI to (re)compute today's actions. This is the expensive
  # operation: it fans out to outreach/suggest, generates drafts, builds
  # meeting preps, and produces agent reasoning text.
  #
  # Returns immediately with a generation_id. The frontend then polls
  # GET /v1/daily-actions or listens on SSE for the completed result.
  # ---------------------------------------------------------------------------
  /v1/daily-actions/generate:
    post:
      operationId: generateDailyActions
      summary: Trigger daily actions generation
      description: |
        Kicks off the AI pipeline to compute today's prioritized actions.
        The generation runs asynchronously. Returns a generation_id that
        can be used to poll for completion status.

        Call this on page open (morning briefing) or when the user
        explicitly requests a refresh.
      tags: [daily-actions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "202":
          description: Generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "429":
          description: Generation already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # GET /v1/daily-actions
  # ---------------------------------------------------------------------------
  # Returns the current day's computed actions. This is the main read endpoint.
  # Cheap to call (reads from cache/DB, no AI computation).
  #
  # If no generation has run today, returns an empty result with
  # status: "not_generated" so the frontend knows to call POST /generate.
  # ---------------------------------------------------------------------------
  /v1/daily-actions:
    get:
      operationId: getDailyActions
      summary: Get today's daily actions
      description: |
        Returns the fully computed daily actions briefing for the
        authenticated BD rep. Includes all action categories, agent
        reasoning, draft messages, and meeting briefings.

        If actions have not been generated yet today, returns
        generation_status: "not_generated".
      tags: [daily-actions]
      parameters:
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [en, vi]
            default: vi
          description: Language for agent reasoning text and draft messages
        - name: include_completed
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: |
            Whether to include completed/skipped/snoozed actions
            (shown as dimmed cards per FR-022)
      responses:
        "200":
          description: Daily actions briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyActionsResponse"

  # ---------------------------------------------------------------------------
  # PATCH /v1/daily-actions/{action_id}
  # ---------------------------------------------------------------------------
  # Updates the state of a single action. This is the fast write path for
  # Mark Sent, Skip, Snooze, and other action state transitions.
  # ---------------------------------------------------------------------------
  /v1/daily-actions/{action_id}:
    patch:
      operationId: updateActionState
      summary: Update an action's state
      description: |
        Updates the state of a daily action (mark_sent, skip, snooze, etc.).
        When marking as sent, this also:
        - Logs the interaction via outreach/contacts/{id}/update
        - Advances the contact's pipeline state
        - Records feedback for the AI learning loop

        Returns the updated action and, if the pipeline state changed,
        the new contact state.
      tags: [daily-actions]
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActionRequest"
      responses:
        "200":
          description: Action updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateActionResponse"
        "404":
          description: Action not found
        "409":
          description: |
            Action state conflict (e.g., trying to mark_sent on an
            already-completed action)

  # ---------------------------------------------------------------------------
  # GET /v1/daily-actions/events (SSE)
  # ---------------------------------------------------------------------------
  # Server-Sent Events stream for real-time updates. The frontend opens
  # this connection on page load and keeps it alive for the session.
  #
  # Events pushed:
  # - prospect_replied: a prospect responded (FR-017)
  # - meeting_approaching: meeting within 2 hours (FR-018)
  # - followup_due: a follow-up deadline was reached (FR-018)
  # - snooze_expired: snoozed action reappearing at 5pm (FR-025)
  # - generation_complete: async generation finished
  # - action_updated: another session updated an action
  # ---------------------------------------------------------------------------
  /v1/daily-actions/events:
    get:
      operationId: streamDailyActionEvents
      summary: SSE stream for real-time action updates
      description: |
        Opens a Server-Sent Events stream for the authenticated user.
        The server pushes events when:
        - A prospect replies to outreach
        - A meeting is approaching (within 2 hours)
        - A follow-up deadline is reached
        - A snoozed action reappears (5pm EOB)
        - The async generation completes
        - An action is updated from another session/device

        The frontend should reconnect automatically on disconnect.
        Include `Last-Event-ID` header on reconnect to resume from
        the last received event.
      tags: [daily-actions]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Resume from this event ID on reconnect
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSEEvent"

  # ---------------------------------------------------------------------------
  # GET /v1/daily-actions/summary
  # ---------------------------------------------------------------------------
  # Returns the day's progress summary. Used for the end-of-day wrap-up
  # (User Story 7) or when the BD rep asks "tong ket hom nay".
  # ---------------------------------------------------------------------------
  /v1/daily-actions/summary:
    get:
      operationId: getDailyActionsSummary
      summary: Get daily progress summary
      description: |
        Returns a summary of today's action completion status including
        counts by state, response rates, meetings booked, and carry-over
        items. The agent uses this to generate summary chat messages.
      tags: [daily-actions]
      parameters:
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [en, vi]
            default: vi
      responses:
        "200":
          description: Daily summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummaryResponse"

  # ---------------------------------------------------------------------------
  # GET /v1/daily-actions/categories/{category_id}/actions
  # ---------------------------------------------------------------------------
  # FR-021: Load more actions for a category (pagination).
  # The initial briefing returns at most 5 actions per category. This endpoint
  # loads subsequent batches using offset-based pagination.
  # ---------------------------------------------------------------------------
  /v1/daily-actions/categories/{category_id}/actions:
    get:
      operationId: loadMoreCategoryActions
      summary: Load more actions for a category
      description: |
        Returns the next batch of actions for a specific category.
        Used when the BD rep clicks "Xem thêm" on a category that has
        more than 5 actions. Returns actions sorted by priority.
      tags: [daily-actions]
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            enum: [replied, followup, new_outreach, meeting_prep, enrichment]
          description: The category to load more actions from
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          description: Number of actions to skip (start of next batch)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
          description: Number of actions to return in this batch
      responses:
        "200":
          description: Next batch of actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadMoreActionsResponse"

  # ---------------------------------------------------------------------------
  # POST /v1/daily-actions/chat
  # ---------------------------------------------------------------------------
  # FR-023: Conversational interaction with the BD Agent.
  # The frontend sends chat messages and receives streamed SSE responses.
  # The backend routes to the AI agent for pipeline queries, strategy
  # questions, contact lookups, etc.
  # ---------------------------------------------------------------------------
  /v1/daily-actions/chat:
    post:
      operationId: chatWithBDAgent
      summary: Send a message to the BD Agent
      description: |
        Sends user messages to the BD Agent for conversational interaction.
        Supports: action commands, pipeline queries, strategy questions,
        analytics requests, contact lookups, and pasting prospect replies
        for analysis. Returns a streamed SSE response (text/event-stream).
      tags: [daily-actions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Streamed agent response (SSE)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE stream following Vercel AI SDK data protocol.
                  Each event contains a chunk of the agent's response.
                  Stream terminates when the agent finishes responding.
        "401":
          description: Missing or invalid access token
        "400":
          description: Missing or invalid messages array

# =============================================================================
# COMPONENT SCHEMAS
# =============================================================================
components:
  schemas:

    # =========================================================================
    # REQUEST SCHEMAS
    # =========================================================================

    GenerateRequest:
      type: object
      description: Options for generating daily actions
      properties:
        language:
          type: string
          enum: [en, vi]
          default: vi
          description: Language for agent reasoning and draft messages
        force_refresh:
          type: boolean
          default: false
          description: |
            If true, regenerates even if actions were already computed
            today. Use when the BD rep explicitly asks to refresh.

    UpdateActionRequest:
      type: object
      required: [transition]
      properties:
        transition:
          type: string
          enum:
            - mark_sent       # BD rep sent the message
            - skip            # BD rep skipped this action
            - snooze          # Hide until EOB (5pm)
            - snooze_custom   # Hide until a specific time
            - mark_completed  # Generic completion (for meeting prep, enrichment)
            - reopen          # Undo a skip/snooze
          description: The state transition to apply
        content:
          type: string
          description: |
            The actual message content sent (if different from draft).
            Used when transition is mark_sent.
        channel:
          type: string
          enum: [LinkedIn, Email, Call, Meeting]
          description: Channel used when marking as sent
        skip_reason:
          type: string
          description: Optional reason when skipping
        snooze_until:
          type: string
          format: date-time
          description: |
            Custom snooze time. Only used with snooze_custom.
            Defaults to 5pm local time for plain "snooze".
        feedback_action:
          type: string
          enum: [used_draft, modified_draft, wrote_own, skipped]
          description: |
            What the BD rep did with the AI-generated draft.
            Feeds the AI learning loop.

    # =========================================================================
    # RESPONSE SCHEMAS
    # =========================================================================

    GenerateResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data:
          type: object
          properties:
            generation_id:
              type: string
              format: uuid
              description: ID to track this generation
            generation_status:
              type: string
              enum: [started, already_in_progress, cached]
              description: |
                - started: new generation kicked off
                - already_in_progress: a generation is already running
                - cached: today's actions are already computed and fresh

    DailyActionsResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data:
          $ref: "#/components/schemas/DailyActionsBriefing"

    DailyActionsBriefing:
      type: object
      description: |
        The full daily actions briefing. This is the main data structure
        that powers the morning briefing chat message.
      properties:
        generation_id:
          type: string
          format: uuid
        generation_status:
          type: string
          enum: [not_generated, started, generating, ready, stale]
          description: |
            - not_generated: no generation has run today
            - started: generation request accepted, queued for processing
            - generating: async generation in progress (worker running)
            - ready: fully computed and current
            - stale: computed but new events have occurred since
        generated_at:
          type: string
          format: date-time
        date:
          type: string
          format: date
          description: The business date these actions are for
        language:
          type: string
          enum: [en, vi]

        # -- AGENT BRIEFING --
        agent_briefing:
          $ref: "#/components/schemas/AgentBriefing"

        # -- ACTION CATEGORIES (ordered by priority) --
        categories:
          type: array
          description: |
            Ordered list of action categories. The order reflects
            the agent's priority assessment for the day.
          items:
            $ref: "#/components/schemas/ActionCategory"

        # -- PIPELINE SUMMARY STATS --
        pipeline_summary:
          $ref: "#/components/schemas/PipelineSummary"

        # -- PROGRESS COUNTERS (for in-session tracking) --
        progress:
          $ref: "#/components/schemas/ActionProgress"

    AgentBriefing:
      type: object
      description: |
        The agent's strategic analysis and reasoning. This becomes
        the narrative text in the morning briefing chat message.
        FR-004, FR-005, FR-006.
      properties:
        greeting:
          type: string
          description: |
            Personalized greeting. Example:
            "Good morning. Day la ke hoach BD hom nay -- toi da phan tich
            pipeline va uu tien theo urgency."
        strategic_reasoning:
          type: string
          description: |
            The main reasoning block. The agent explains the most
            important strategic context across the entire pipeline.
            This is NOT a summary of categories -- it is a narrative
            that connects the dots. Example:
            "Meeting voi Dang Thi Hong vao 2026-02-13 14:00 -- chi con
            2 ngay. Toi da chuan bi briefing day du dua tren 4 touchpoints
            / 17 ngay tuong tac truoc do. Day la deal co potential cao
            nhat trong pipeline hien tai."
        memory_references:
          type: array
          description: |
            Explicit conversation memory citations the agent uses.
            These appear naturally within the strategic_reasoning text
            but are also structured here for programmatic use.
          items:
            type: object
            properties:
              contact_id:
                type: string
              contact_name:
                type: string
              event_summary:
                type: string
                description: "e.g., 'replied at 14:32 on 07/02 showing interest in partner onboarding automation'"
              event_timestamp:
                type: string
                format: date-time
              relevance:
                type: string
                description: Why the agent cited this memory
        category_counts:
          type: array
          description: |
            Summary badges for the briefing header.
            Example: [{category: "replied", label: "Replied (can action)", count: 1, icon: "message-circle", color: "green"}]
          items:
            type: object
            properties:
              category:
                type: string
                enum: [replied, followup, new_outreach, meeting_prep, enrichment]
              label:
                type: string
                description: Display label (localized)
              count:
                type: integer
              icon:
                type: string
                description: Icon identifier for the frontend
              color:
                type: string
                description: |
                  CSS color name or class for the badge. Used by the frontend
                  to render category-specific styling.
                  Example values: "green", "yellow", "blue", "purple", "orange"

    ActionCategory:
      type: object
      description: |
        A group of actions sharing the same type/urgency.
        Rendered as an expandable section in the chat briefing.
      properties:
        id:
          type: string
          enum: [replied, followup, new_outreach, meeting_prep, enrichment]
        label:
          type: string
          description: Localized display label
        icon:
          type: string
        color:
          type: string
          description: CSS color class or hex for the category badge
        description:
          type: string
          description: |
            Category-level agent reasoning. Example for followup:
            "2 contacts chua phan hoi. Tran Thi Mai (Day 5, van trong
            window hieu qua); Hoang Anh Dung (lan cuoi -- Day 10,
            neu khong reply se chuyen DROPPED)."
        actions:
          type: array
          items:
            $ref: "#/components/schemas/DailyAction"
        total_count:
          type: integer
          description: |
            Total actions in this category (may be more than
            actions.length if paginated via batch_size)
        has_more:
          type: boolean
          description: Whether there are more actions to load
        next_offset:
          type: integer
          description: Offset for loading the next batch

    DailyAction:
      type: object
      description: |
        A single suggested action for a BD rep. This is the data
        model behind each "action card" in the chat UI.
      required: [id, type, contact, priority, status]
      properties:
        id:
          type: string
          format: uuid
          description: Unique action ID for state updates

        # -- ACTION TYPE --
        type:
          type: string
          enum: [outreach, followup, respond, meeting_prep, enrich]
          description: |
            - outreach: new cold outreach to a contact
            - followup: scheduled follow-up (cadence-based)
            - respond: prospect replied, needs response
            - meeting_prep: meeting within 48h needs preparation
            - enrich: contact missing critical data

        # -- TARGET CONTACT (embedded summary) --
        contact:
          $ref: "#/components/schemas/ActionContact"

        # -- PRIORITY --
        priority:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Priority score (1 = highest priority, 100 = lowest).
            Computed from: response recency, cadence deadline,
            meeting proximity, data completeness, lifecycle stage.
        priority_factors:
          type: array
          description: Breakdown of what contributed to the priority score
          items:
            type: object
            properties:
              factor:
                type: string
                description: "e.g., 'response_recency', 'cadence_deadline', 'meeting_proximity'"
              value:
                type: number
              description:
                type: string

        # -- AGENT REASONING --
        reasoning:
          type: string
          description: |
            Agent's explanation of WHY this specific action is
            suggested at this priority. References conversation
            memory and data points. Example:
            "Day 5, van trong window hieu qua cho follow-up #1.
            Message truoc gui ngay 21/02 ve software outsourcing.
            Contact o vi tri CTO -- decision maker truc tiep."

        # -- STATUS & LIFECYCLE --
        status:
          type: string
          enum: [suggested, in_progress, completed, skipped, snoozed, deferred]
          description: Current action state
        status_changed_at:
          type: string
          format: date-time
        snooze_until:
          type: string
          format: date-time
          description: When a snoozed action reappears

        # -- OUTREACH / FOLLOW-UP SPECIFIC FIELDS --
        outreach_data:
          $ref: "#/components/schemas/OutreachActionData"

        # -- MEETING PREP SPECIFIC FIELDS --
        meeting_data:
          $ref: "#/components/schemas/MeetingActionData"

        # -- ENRICHMENT SPECIFIC FIELDS --
        enrichment_data:
          $ref: "#/components/schemas/EnrichmentActionData"

        # -- RESPOND (REPLIED) SPECIFIC FIELDS --
        respond_data:
          $ref: "#/components/schemas/RespondActionData"

        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # ACTION-TYPE SPECIFIC DATA
    # -------------------------------------------------------------------------

    OutreachActionData:
      type: object
      description: Data specific to outreach and follow-up actions
      properties:
        draft_message:
          type: string
          description: Pre-generated personalized draft message
        scenario:
          type: string
          enum: [role_based, industry_based, no_reply_followup, post_reply, post_meeting, re_engage]
        context_level:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        company_context:
          type: string
          description: |
            Brief company intelligence block displayed on the card.
            Derived from AI insights and research findings.
        followup_number:
          type: integer
          description: "1 for FOLLOW_UP_1, 2 for FOLLOW_UP_2, null for initial outreach"
        days_since_last_interaction:
          type: integer
        previous_messages_count:
          type: integer
          description: Number of messages previously sent to this contact
        last_sent_date:
          type: string
          format: date-time
          description: When the last message was sent
        is_final_followup:
          type: boolean
          description: |
            True if this is the last follow-up before the contact
            would be moved to DROPPED
        outreach_state:
          $ref: "#/components/schemas/OutreachStateSnapshot"

    OutreachStateSnapshot:
      type: object
      description: Snapshot of the contact's outreach state at generation time
      properties:
        conversation_state:
          type: string
          enum: [COLD, NO_REPLY, REPLIED, POST_MEETING, DROPPED]
        next_step:
          type: string
          enum: [SEND, FOLLOW_UP_1, FOLLOW_UP_2, SET_MEETING, FOLLOW_UP_MEETING_1, FOLLOW_UP_MEETING_2, PREPARE_MEETING, WAIT, FOLLOW_UP, DROP]
        followup_count:
          type: integer
        max_followups:
          type: integer

    MeetingActionData:
      type: object
      description: Data specific to meeting prep actions
      properties:
        meeting_id:
          type: string
          format: uuid
        meeting_title:
          type: string
        meeting_time:
          type: string
          format: date-time
        meeting_duration_minutes:
          type: integer
        meeting_channel:
          type: string
        hours_until_meeting:
          type: number
          description: Hours from now until the meeting
        briefing:
          $ref: "#/components/schemas/MeetingBriefing"

    MeetingBriefing:
      type: object
      description: |
        Pre-generated meeting preparation document (FR-011).
        Aligned with existing MeetingBriefResponse from intelligence API.
      properties:
        prospect_profile_summary:
          type: string
          description: Role, background, experience summary
        conversation_summary:
          type: object
          properties:
            touchpoint_count:
              type: integer
            duration_days:
              type: integer
            tone_assessment:
              type: string
              description: "e.g., 'professional and interested'"
            key_topics:
              type: array
              items:
                type: string
        pain_points:
          type: array
          items:
            type: object
            properties:
              pain_point:
                type: string
              confidence:
                type: number
              evidence:
                type: array
                items:
                  type: string
        suggested_agenda:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              duration_minutes:
                type: integer
              notes:
                type: string
        discovery_questions:
          type: array
          items:
            type: string
        recommended_next_steps:
          type: array
          items:
            type: string
        risk_flags:
          type: array
          items:
            type: string

    EnrichmentActionData:
      type: object
      description: Data specific to data enrichment actions
      properties:
        missing_fields:
          type: array
          description: |
            Fields that are missing and blocking quality outreach.
            Example: ["job_title", "company", "industry"]
          items:
            type: string
        quality_impact:
          type: string
          description: |
            Agent explanation of how missing data impacts outreach
            quality. Example: "Khong the gen message chat luong neu
            khong biet role hoac company context."
        contact_status:
          type: string
          enum: [ready, pending]
        suggested_sources:
          type: array
          description: Where to find the missing data
          items:
            type: object
            properties:
              field:
                type: string
              source:
                type: string
                description: "e.g., 'LinkedIn profile', 'Company website', 'Apollo.io'"
              url:
                type: string
                format: uri

    RespondActionData:
      type: object
      description: |
        Data specific to "prospect replied" actions. This is the
        highest-priority category -- prospect already showed interest.
      properties:
        reply_preview:
          type: string
          description: Preview of the prospect's reply content
        reply_timestamp:
          type: string
          format: date-time
        reply_channel:
          type: string
          enum: [LinkedIn, Email, Call, Meeting]
        intent_assessment:
          type: string
          enum: [interested, requesting_info, scheduling_meeting, declining, unclear]
          description: Agent's assessment of the reply intent
        intent_reasoning:
          type: string
          description: |
            Agent's detailed analysis of the reply. Example:
            "Noi dung cho thay interest thuc su ve partner onboarding
            automation. Can set meeting trong vong 24-48h de khong
            mat momentum."
        recommended_action:
          type: string
          description: |
            Specific guidance. Example: "Propose 2-3 time slots cho
            tuan toi. Tone: professional, khong qua eager."
        draft_response:
          type: string
          description: Pre-generated response draft
        conversation_context:
          type: object
          properties:
            total_interactions:
              type: integer
            days_in_conversation:
              type: integer
            last_outgoing_message_preview:
              type: string
            key_topics_discussed:
              type: array
              items:
                type: string

    # -------------------------------------------------------------------------
    # CONTACT SUMMARY (embedded in actions)
    # -------------------------------------------------------------------------

    ActionContact:
      type: object
      description: |
        Lightweight contact summary embedded in each action card.
        Clicking the name opens the contact detail slide-over panel.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        company:
          type: string
        job_title:
          type: string
        linkedin_url:
          type: string
          format: uri
        source:
          type: string
          enum: [LinkedIn, Apollo, Manual, HubSpot]
          description: How this contact was imported
        status:
          type: string
          enum: [ready, pending]
        outreach_stage:
          type: string
          enum: [COLD, NO_REPLY, REPLIED, POST_MEETING, DROPPED]
        lifecycle_stage:
          type: string
          enum: [new, contacted, replied, qualified, proposal, won, lost, meeting, dropped]
        avatar_url:
          type: string
          format: uri
          description: Optional avatar/photo URL

    # -------------------------------------------------------------------------
    # PIPELINE SUMMARY
    # -------------------------------------------------------------------------

    PipelineSummary:
      type: object
      description: |
        High-level pipeline stats included in the briefing.
        Provides the agent with data for its strategic reasoning.
      properties:
        total_active_contacts:
          type: integer
        contacts_by_stage:
          type: object
          additionalProperties:
            type: integer
          description: |
            Map of outreach_stage -> count.
            Example: {"COLD": 5, "NO_REPLY": 8, "REPLIED": 3, "POST_MEETING": 2}
        contacts_by_lifecycle:
          type: object
          additionalProperties:
            type: integer
        response_rate_7d:
          type: number
          description: Reply rate over the last 7 days (0.0 to 1.0)
        meetings_booked_7d:
          type: integer
        avg_response_time_hours:
          type: number
          description: Average time to respond to prospect replies

    # -------------------------------------------------------------------------
    # ACTION PROGRESS (in-session tracking)
    # -------------------------------------------------------------------------

    ActionProgress:
      type: object
      description: |
        Running tally of action completion for the current day.
        Updated after each PATCH /v1/daily-actions/{id}.
      properties:
        total:
          type: integer
        completed:
          type: integer
        skipped:
          type: integer
        snoozed:
          type: integer
        remaining:
          type: integer
        completion_rate:
          type: number
          description: "completed / total (0.0 to 1.0)"

    # -------------------------------------------------------------------------
    # UPDATE ACTION RESPONSE
    # -------------------------------------------------------------------------

    UpdateActionResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data:
          type: object
          properties:
            action:
              $ref: "#/components/schemas/DailyAction"
            contact_state_change:
              type: object
              description: |
                Present only when the contact's pipeline state changed
                (e.g., mark_sent on COLD -> advances to NO_REPLY).
              properties:
                previous_state:
                  type: string
                new_state:
                  type: string
                new_next_step:
                  type: string
            progress:
              $ref: "#/components/schemas/ActionProgress"

    # -------------------------------------------------------------------------
    # SSE EVENT SCHEMAS
    # -------------------------------------------------------------------------

    SSEEvent:
      description: |
        Server-Sent Events follow the W3C EventSource format:
          event: <event_type>
          id: <event_id>
          data: <JSON payload>

        Event types and their payloads are documented below.
      oneOf:
        - $ref: "#/components/schemas/SSEProspectReplied"
        - $ref: "#/components/schemas/SSEMeetingApproaching"
        - $ref: "#/components/schemas/SSEFollowupDue"
        - $ref: "#/components/schemas/SSESnoozeExpired"
        - $ref: "#/components/schemas/SSEGenerationComplete"
        - $ref: "#/components/schemas/SSEActionUpdated"

    SSEProspectReplied:
      type: object
      description: |
        event: prospect_replied
        Sent when a prospect responds to outreach (FR-017).
        The frontend renders this as a highlighted alert message in chat.
      properties:
        event_type:
          type: string
          const: prospect_replied
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        contact:
          $ref: "#/components/schemas/ActionContact"
        reply_preview:
          type: string
        reply_timestamp:
          type: string
          format: date-time
        reply_channel:
          type: string
        intent_assessment:
          type: string
          enum: [interested, requesting_info, scheduling_meeting, declining, unclear]
        agent_reasoning:
          type: string
          description: |
            Agent's analysis and recommended action.
            Example: "Pham Quoc Bao da reply luc 14:32 ngay 07/02.
            Noi dung cho thay interest thuc su ve partner onboarding
            automation. Can set meeting trong vong 24-48h."
        recommended_action:
          type: string
        draft_response:
          type: string
          description: Optional pre-generated response draft
        action_id:
          type: string
          format: uuid
          description: |
            ID of the daily action created for this event.
            Can be used with PATCH to update its state.

    SSEMeetingApproaching:
      type: object
      description: |
        event: meeting_approaching
        Sent 2 hours before a scheduled meeting (FR-018).
      properties:
        event_type:
          type: string
          const: meeting_approaching
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        meeting_id:
          type: string
        meeting_title:
          type: string
        meeting_time:
          type: string
          format: date-time
        contact:
          $ref: "#/components/schemas/ActionContact"
        hours_until:
          type: number
        has_prep:
          type: boolean
          description: Whether meeting prep has been generated
        agent_message:
          type: string
          description: "e.g., 'Meeting voi Dang Thi Hong trong 2 gio. Prep da san sang.'"
        action_id:
          type: string
          format: uuid

    SSEFollowupDue:
      type: object
      description: |
        event: followup_due
        Sent when a follow-up reaches its cadence deadline.
      properties:
        event_type:
          type: string
          const: followup_due
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        contact:
          $ref: "#/components/schemas/ActionContact"
        followup_number:
          type: integer
        days_since:
          type: integer
        is_final:
          type: boolean
        agent_message:
          type: string
        action_id:
          type: string
          format: uuid

    SSESnoozeExpired:
      type: object
      description: |
        event: snooze_expired
        Sent at 5pm (or custom snooze time) to resurface snoozed actions.
      properties:
        event_type:
          type: string
          const: snooze_expired
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        actions:
          type: array
          description: All actions whose snooze expired at this time
          items:
            $ref: "#/components/schemas/DailyAction"
        agent_message:
          type: string
          description: |
            Agent's reminder message. Example:
            "Da 5pm -- 3 actions da snooze can xu ly truoc khi ket thuc
            ngay hoac defer sang ngay mai."

    SSEGenerationComplete:
      type: object
      description: |
        event: generation_complete
        Sent when async POST /generate finishes.
      properties:
        event_type:
          type: string
          const: generation_complete
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        generation_id:
          type: string
          format: uuid
        action_count:
          type: integer
          description: Total number of actions generated

    SSEActionUpdated:
      type: object
      description: |
        event: action_updated
        Sent when an action is updated from another session/device.
      properties:
        event_type:
          type: string
          const: action_updated
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        action_id:
          type: string
          format: uuid
        new_status:
          type: string
          enum: [suggested, in_progress, completed, skipped, snoozed, deferred]
        updated_by:
          type: string
          description: User or system that made the update

    # -------------------------------------------------------------------------
    # DAILY SUMMARY
    # -------------------------------------------------------------------------

    DailySummaryResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data:
          type: object
          properties:
            date:
              type: string
              format: date
            agent_summary:
              type: string
              description: |
                Agent-generated narrative summary of the day.
                Celebrates wins, flags concerns, lists carry-overs.
            progress:
              $ref: "#/components/schemas/ActionProgress"
            breakdown:
              type: object
              properties:
                outreach_sent:
                  type: integer
                followups_sent:
                  type: integer
                replies_handled:
                  type: integer
                meetings_prepped:
                  type: integer
                contacts_enriched:
                  type: integer
            outcomes:
              type: object
              properties:
                responses_received_today:
                  type: integer
                meetings_booked_today:
                  type: integer
                contacts_dropped:
                  type: integer
            carry_over:
              type: array
              description: Actions that were not completed and carry to tomorrow
              items:
                type: object
                properties:
                  action_id:
                    type: string
                    format: uuid
                  type:
                    type: string
                  contact_name:
                    type: string
                  reason:
                    type: string
                    description: "e.g., 'snoozed', 'not_addressed', 'deferred'"

    # -------------------------------------------------------------------------
    # LOAD MORE ACTIONS (FR-021)
    # -------------------------------------------------------------------------

    LoadMoreActionsResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data:
          type: object
          required: [actions, has_more]
          properties:
            actions:
              type: array
              description: Next batch of actions, sorted by priority
              items:
                $ref: "#/components/schemas/DailyAction"
            has_more:
              type: boolean
              description: Whether more actions exist beyond this batch
            next_offset:
              type: integer
              description: |
                Offset to pass for the next batch. Only present when
                has_more is true.

    # -------------------------------------------------------------------------
    # CHAT REQUEST (FR-023)
    # -------------------------------------------------------------------------

    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          description: |
            Conversation history following the Vercel AI SDK message format.
            The last message is the user's new input.
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant, system]
              content:
                type: string
        stream:
          type: boolean
          default: true
          description: |
            Whether to stream the response via SSE. When true, the response
            is text/event-stream. When false, returns a single JSON response
            (not recommended for production — streaming provides better UX).

    # -------------------------------------------------------------------------
    # ERROR
    # -------------------------------------------------------------------------

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  # ===========================================================================
  # SECURITY
  # ===========================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Same auth as existing API. Token obtained from the auth
        service and injected by the ky client middleware.

security:
  - bearerAuth: []

# =============================================================================
# TAGS
# =============================================================================
tags:
  - name: daily-actions
    description: |
      Daily BD action suggestions, prioritization, and state management.
      Aggregates data from outreach, contacts, meetings, and intelligence
      services into a unified daily workflow.
