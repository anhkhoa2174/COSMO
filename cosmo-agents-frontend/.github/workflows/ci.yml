  install_with_ssh_prod:
    name: deploy
    runs-on: self-hosted
    needs: build
    environment: prod
    env:
      ECR_URL: ${{ secrets.ECR_URL }}
      IMAGE_NAME: ${{ secrets.ECR_URL }}/cosmos-agent-frontend
      TAG: prod
      AWS_REGION: ${{ secrets.AWS_REGION }}
      SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
      SERVER_PROD: ${{ secrets.SERVER_PROD }}
      SSH_PRIVATE_KEY_ROCKSHIP: ${{ secrets.SSH_PRIVATE_KEY_ROCKSHIP }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare SSH client
        run: |
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S apt-get update -qq
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S apt-get install -y -qq openssh-client

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

      - name: Deploy to production server
        run: |
          eval "$(ssh-agent -s)"
          ssh-add <(echo "${SSH_PRIVATE_KEY_ROCKSHIP}")

          ssh "$SERVER_PROD" "
            set -e
            aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_URL};
            docker pull ${IMAGE_NAME}:${TAG};
            docker stop prod_cosmos-frontend || true;
            docker rm prod_cosmos-frontend || true;
            docker run -d --name=prod_cosmos-frontend \
              -m 2G --memory-reservation 1700m \
              --network=nginx \
              --pull always \
              --restart unless-stopped \
              ${IMAGE_NAME}:${TAG};
            docker image prune -af;
          "
