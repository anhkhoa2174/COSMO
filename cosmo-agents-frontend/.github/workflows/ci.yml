name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: self-hosted
    environment: prod
    env:
      ECR_URL: ${{ secrets.ECR_URL }}
      BOT_PRIVATE_TOKEN: ${{ secrets.BOT_PRIVATE_TOKEN }}
      TAG: prod
      IMAGE_NAME: ${{ secrets.ECR_URL }}/cosmos-agent-frontend
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.11.1

      - name: Fetch .env from GitLab
        run: |
          rm -rf .env
          sudo apt update -y && sudo apt install -y curl
          curl --header "PRIVATE-TOKEN: $BOT_PRIVATE_TOKEN" \
            "https://gitlab.rockitflow.com/api/v4/projects/1/repository/files/frontend%2Fcosmo-agents%2Fprod%2F.env/raw?ref=master" \
            > .env

      - name: Install dependencies
        run: pnpm install

      - name: Build Next.js
        run: pnpm run build

      - name: Configure Kaniko
        run: |
          mkdir -p ${{ runner.temp }}/kaniko/.docker
          echo '{"credsStore":"ecr-login"}' > ${{ runner.temp }}/kaniko/.docker/config.json

      - name: Build & Push Docker image (Kaniko)
        uses: addnab/docker-run-action@v3
        with:
          image: gcr.io/kaniko-project/executor:v1.10.0-debug
          options: >-
            -v ${{ github.workspace }}:/workspace
            -v ${{ runner.temp }}/kaniko/.docker:/kaniko/.docker
            -e IMAGE_NAME=${{ env.IMAGE_NAME }}
            -e TAG=${{ env.TAG }}
            -e BOT_PRIVATE_TOKEN=${{ env.BOT_PRIVATE_TOKEN }}
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            -e AWS_REGION=${{ env.AWS_REGION }}
          run: |
            /kaniko/executor \
              --context "/workspace" \
              --dockerfile "/workspace/build/Dockerfile" \
              --destination "${IMAGE_NAME}:${TAG}" \
              --build-arg BOT_PRIVATE_TOKEN=${BOT_PRIVATE_TOKEN}

